<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Needledrop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="idle">
  <div id="bg" aria-hidden="true">
    <div class="bgimg" id="bgA"></div>
    <div class="bgimg" id="bgB"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <header id="bar">
    <div class="drag"></div>
    <div class="btns">
      <button id="btn-settings" title="עיצוב בלייב · Design panel (S)" aria-label="Design panel">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button id="btn-widget" title="מצב וידג׳ט · Widget (W)" aria-label="Widget mode">
        <svg viewBox="0 0 24 24"><rect x="3" y="13" width="11" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 4h16v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-style" title="סגנון ויניל · Vinyl style (V)" aria-label="Vinyl style">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>
      </button>
      <button id="btn-pin" title="תמיד למעלה · Always on top (P)" aria-label="Always on top">
        <svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2h-4.2V21h-1.6v-7H7v-2l3-3-1-6z" fill="currentColor"/></svg>
      </button>
      <button id="btn-full" title="מסך מלא · Fullscreen (F)" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button data-cmd="minimize" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button data-cmd="close" class="x" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="stage">
      <div id="deck">
        <div id="discwrap">
          <div id="disc">
            <div id="label"></div>
            <div class="hole"></div>
          </div>
          <div id="sheen"></div>
        </div>
        <div id="arm"><div class="weight"></div><div class="tube"></div><div class="head"></div></div>
        <div id="pivot"></div>
      </div>

      <div id="meta">
        <h1 id="title" dir="auto">Apple Music</h1>
        <p id="artist" dir="auto"></p>
        <p id="album" dir="auto"></p>
      </div>

      <div id="progress">
        <span id="tcur">0:00</span>
        <div class="bar" id="bar-seek"><div id="fill"></div></div>
        <span id="ttot">0:00</span>
      </div>

      <div id="controls" aria-label="Playback controls">
        <button id="c-prev" title="הקודם · Previous (B)" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5L9 12l10 7z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
        <button id="c-play" class="main" title="נגן / השהה · Play-pause (Space)" aria-label="Play or pause">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
        </button>
        <button id="c-next" title="הבא · Next (N)" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
      </div>
    </section>

    <section id="lyrics">
      <div id="track"></div>
      <div id="lyric-status"></div>
    </section>
  </main>

  <canvas id="eq" aria-hidden="true"></canvas>
  <div id="ss-clock" aria-hidden="true"><span id="ss-time"></span><span id="ss-date"></span></div>
  <div id="drop-hint"><div>שחרר כאן קובץ מילים<small>.lrc / .txt</small></div></div>
  <div id="banner" role="status"></div>
  <div id="toast"></div>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
